<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mock LinkedIn — Profile</title>
<style>
  body {
    font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #f3f2ef;
    color: #1f2328;
  }
  .mock-navbar {
    background: #ffffff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mock-logo {
    color: #0a66c2;
    font-weight: 800;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mock-demo-badge {
    background: #e8f0fe;
    color: #0a66c2;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
  }
  .mock-container {
    max-width: 820px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .mock-card {
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .mock-banner {
    height: 120px;
    background: linear-gradient(135deg, #0073b1, #004182);
  }
  .mock-profile-header {
    padding: 16px 24px 24px;
    position: relative;
  }
  .mock-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid #ffffff;
    margin-top: -64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #mock-profile-name {
    font-size: 22px;
    font-weight: 700;
    margin: 12px 0 4px;
  }
  #mock-profile-headline {
    color: #4b5563;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .mock-ctas {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
  }
  #mock-message-btn {
    background: #0a66c2;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #mock-message-btn:hover { background: #084e96; }
  .mock-btn-secondary {
    background: #ffffff;
    color: #0a66c2;
    border: 1px solid #0a66c2;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #mock-demo-widget-btn {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #16a34a;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #mock-abort-slot { margin: 12px 0; }
  #mock-captcha {
    background: #fff3cd;
    border: 2px solid #b00020;
    border-radius: 8px;
    padding: 12px;
    margin: 8px 0;
    font-weight: 700;
    color: #b00020;
  }
  #mock-activity-warning {
    background: #f8d7da;
    border: 1px solid #b00020;
    border-radius: 8px;
    padding: 12px;
    margin: 8px 0;
    color: #721c24;
    font-weight: 600;
  }

  /* Mock LinkedIn Bottom-Right Docked Messaging Bar */
  .mock-dock-window {
    position: fixed;
    bottom: 0;
    right: 24px;
    width: 360px;
    max-width: calc(100vw - 32px);
    background: #ffffff;
    border: 1px solid #cfd8dc;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
    z-index: 1000;
  }
  .mock-dock-header {
    background: #ffffff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 10px 10px 0 0;
  }
  #mock-thread {
    min-height: 80px;
    max-height: 180px;
    overflow-y: auto;
    padding: 10px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
  }
  .mock-bubble {
    background: #e8f0fe;
    border-radius: 10px;
    padding: 7px 12px;
    margin: 6px 0;
    font-size: 13px;
    line-height: 1.4;
    max-width: 85%;
    margin-left: auto;
    color: #1a73e8;
  }
  .mock-compose-area {
    padding: 10px 12px;
    background: #ffffff;
  }
  #mock-compose {
    border: 1px solid #cfd8dc;
    border-radius: 6px;
    min-height: 48px;
    max-height: 100px;
    overflow-y: auto;
    padding: 8px 10px;
    font-size: 13px;
    margin-bottom: 8px;
    background: #ffffff;
  }
  #mock-compose:focus {
    outline: none;
    border-color: #0a66c2;
  }
  .mock-compose-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  #mock-send {
    background: #0a66c2;
    color: #ffffff;
    border: none;
    border-radius: 16px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #mock-send:hover { background: #084e96; }
</style>
</head>
<body>
  <div class="mock-navbar">
    <div class="mock-logo">
      <span>in</span>
      <span>Mock LinkedIn</span>
    </div>
    <div class="mock-demo-badge">AutoRef Test Environment</div>
  </div>

  <div class="mock-container">
    <div class="mock-card">
      <div class="mock-banner"></div>
      <div class="mock-profile-header">
        <div class="mock-avatar">👤</div>
        <h1 id="mock-profile-name">…</h1>
        <div id="mock-profile-headline">…</div>
        <div class="mock-ctas">
          <button id="mock-message-btn" type="button" role="button" aria-label="Message">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1h12z"/></svg>
            Message
          </button>
          <button class="mock-btn-secondary" type="button">More</button>
          <button id="mock-demo-widget-btn" type="button" title="Interactive demo of AutoRef Review Overlay">Preview Overlay Widget</button>
        </div>
        <div id="mock-abort-slot"></div>
      </div>
    </div>
  </div>

  <!-- Docked LinkedIn Message Modal Container -->
  <div class="mock-dock-window">
    <div class="mock-dock-header">
      <span id="mock-dock-title">Messaging</span>
      <span style="font-size: 11px; color: #666;">Mock Docked Window</span>
    </div>
    <div id="mock-thread" hidden></div>
    <div class="mock-compose-area">
      <div id="mock-compose" role="textbox" contenteditable="true" aria-label="Write a message" placeholder="Write a message..."></div>
      <div class="mock-compose-footer">
        <button id="mock-send" type="button" aria-label="Send now">Send</button>
      </div>
    </div>
  </div>
  <!-- AutoRef Scripts for Standalone Interactive Widget Demonstration -->
  <script src="../../lib/delay.js"></script>
  <script src="../../content/selectors.js"></script>
  <script src="../../content/overlay-widget.js"></script>

<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var profile = {
    urn: q.get('urn') || 'mock-unknown',
    name: q.get('name') || 'Unknown Person',
    role: q.get('role') || 'Member',
    company: q.get('company') || 'Unknown Co',
    hasThread: Math.max(0, parseInt(q.get('hasThread') || '0', 10)),
    captcha: q.get('captcha') === '1',
    warning: q.get('warning') === '1',
  };
  document.title = 'Mock LinkedIn — ' + profile.name;
  document.getElementById('mock-profile-name').textContent = profile.name;
  document.getElementById('mock-profile-headline').textContent = profile.role + ' at ' + profile.company;
  document.getElementById('mock-dock-title').textContent = 'Message ' + profile.name.split(' ')[0];

  var slot = document.getElementById('mock-abort-slot');
  if (profile.captcha) {
    var c = document.createElement('div');
    c.id = 'mock-captcha';
    c.textContent = 'Security verification: please confirm you are human (mock captcha).';
    slot.appendChild(c);
  }
  if (profile.warning) {
    var w = document.createElement('div');
    w.id = 'mock-activity-warning';
    w.textContent = 'Unusual activity detected on your account (mock warning).';
    slot.appendChild(w);
  }
  var thread = document.getElementById('mock-thread');
  function addBubble(text) {
    var b = document.createElement('div');
    b.className = 'mock-bubble';
    b.textContent = text;
    thread.appendChild(b);
    return b;
  }
  for (var i = 0; i < profile.hasThread; i++) {
    addBubble('Prior message ' + (i + 1) + ' with ' + profile.name + ' (seeded fixture).');
  }

  document.getElementById('mock-message-btn').addEventListener('click', function () {
    thread.hidden = false;
    document.getElementById('mock-compose').focus();
  });

  document.getElementById('mock-send').addEventListener('click', function () {
    var box = document.getElementById('mock-compose');
    var text = (box.textContent || '').trim();
    if (!text) return;
    thread.hidden = false;
    addBubble(text);
    box.textContent = '';
    window.__mockSent = { urn: profile.urn, text: text, at: new Date().toISOString() };
  });

  // Demo toggle for in-page overlay widget preview
  document.getElementById('mock-demo-widget-btn').addEventListener('click', function () {
    if (window.AutoRef && window.AutoRef.Overlay) {
      window.AutoRef.Overlay.render({
        profile: profile,
        draft: 'Hi ' + (profile.name.split(' ')[0] || 'there') + ', I noticed you work at ' + profile.company + ' as ' + profile.role + '. I would love to connect and learn more about your experience there!',
        status: 'Interactive Preview',
        onApprove: function (t) {
          alert('Approved! Draft text:\n\n' + t);
          window.AutoRef.Overlay.showCountdown(10, '⏱️ Next profile in {time}', function () {
            window.AutoRef.Overlay.remove();
          });
        },
        onRegenerate: function () {
          return new Promise(function (resolve) {
            setTimeout(function () {
              resolve('Hi ' + (profile.name.split(' ')[0] || '') + ', impressed by your work in ' + profile.role + ' at ' + profile.company + '! Are you open to a quick chat about opportunities?');
            }, 500);
          });
        },
        onSkip: function () {
          window.AutoRef.Overlay.remove();
        }
      });
    } else {
      alert('Attach AutoRef extension or load content scripts to preview live widget!');
    }
  });

  window.__mockProfile = profile;
})();
</script>
</body>
</html>
